<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EcoQuiz — Aplicación educativa sobre la naturaleza de México. Aprende sobre ecosistemas y biodiversidad jugando.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#27AE60">

  <!-- SEO -->
  <meta name="keywords" content="EcoQuiz, educación, naturaleza, México, biodiversidad, ecosistemas, primaria, quiz, SEP">
  <meta name="author" content="EcoQuiz">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EcoQuiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EcoQuiz — Aprende sobre la naturaleza de México</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fondo mientras carga la app */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #E2F4D8 0%, #FDE8E1 50%, #D6EAF8 100%);
    }

    /* Pantalla de carga personalizada */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      z-index: 999;
    }

    .loading-logo {
      font-size: 64px;
      margin-bottom: 16px;
      animation: bounce 1.5s ease infinite;
    }

    .loading-title {
      font-size: 28px;
      font-weight: 900;
      color: #4A3423;
      margin-bottom: 8px;
    }

    .loading-subtitle {
      font-size: 14px;
      color: #7A8B7A;
      margin-bottom: 24px;
    }

    .loading-bar-container {
      width: 200px;
      height: 6px;
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #27AE60, #2ECC71);
      border-radius: 10px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* Scrollbar personalizado */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <!-- Pantalla de carga que se muestra mientras Flutter arranca -->
  <div class="loading-screen" id="loading">
    <div class="loading-logo">🌿</div>
    <div class="loading-title">EcoQuiz</div>
    <div class="loading-subtitle">Cargando tu aventura por México...</div>
    <div class="loading-bar-container">
      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    // Ocultar pantalla de carga cuando Flutter esté listo
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.5s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
